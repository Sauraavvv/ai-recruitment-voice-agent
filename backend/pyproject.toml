[project]
name = "recruitment-voice-agent-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
  "S101",      # assert is fine in tests
  "ASYNC109",  # health checks take an explicit per-check timeout on purpose
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S105", "S106"]  # fake secrets in tests
"app/database/migrations/versions/**" = ["E501"]  # long CHECK constraint strings
# Interactive/offline tools: blocking file reads and input() are fine there.
"app/agent/cli.py" = ["ASYNC240", "ASYNC250"]
"app/tests/agent_eval/**" = ["ASYNC240", "ASYNC250", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["arq.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
# Live OpenAI tests cost money and need a key: run them explicitly with `make agent-eval`.
addopts = "-m 'not llm'"
markers = ["llm: calls the real OpenAI API"]
