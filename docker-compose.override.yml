# Development overrides: live code reload. Loaded automatically by `docker compose up`.

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload",
      ]
    volumes:
      - ./backend/app:/app/app
      # `make tts-say` writes WAVs here so they can be played on the host
      - ./backend/artifacts:/app/artifacts

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # watchfiles restarts the whole process on a change. `arq --watch` only restarts the worker
    # loop inside the same process, so edited modules were never re-imported (Phase 5).
    command: ["watchfiles", "--filter", "python", "arq app.workers.settings.WorkerSettings", "app"]
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
