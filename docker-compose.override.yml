# Development overrides: live code reload. Loaded automatically by `docker compose up`.

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload",
      ]
    volumes:
      - ./backend/app:/app/app

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: ["arq", "app.workers.settings.WorkerSettings", "--watch", "app"]
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
